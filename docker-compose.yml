services:
  postgres:
    image: postgres:16-alpine
    container_name: voxshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: voxshield
      POSTGRES_PASSWORD: voxshield_secret_password
      POSTGRES_DB: voxshield
    ports:
      - "5432:5432"
    volumes:
      - voxshield_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxshield -d voxshield"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  voxshield_pgdata:
    driver: local
